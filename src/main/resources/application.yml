spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lextrace
    username: postgres
    password: LexTrace@123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# AWS Bedrock configuration
aws:
  region: ${AWS_REGION:us-east-1}
  bedrock:
    model-id: ${AWS_BEDROCK_MODEL_ID:cohere.embed-english-v3}

# Local upload directory
app:
  upload-dir: ${UPLOAD_DIR:uploads/documents}
